<div class="community-account-shell"
  [class.account-shell-onboarding]="variant() === 'onboarding'"
  [class.account-shell-security]="variant() === 'account-security'"
  [class.account-shell-wide-form]="formWidth() === 'wide'">
  <div class="account-shell-header">
    <app-community-header [showSignIn]="showSignIn()" layout="activation" />
  </div>
  <main class="account-shell-grid">
    <section class="account-shell-hero" aria-label="Community introduction">
      <div class="account-shell-hero-inner"><ng-content select="[account-hero]"></ng-content></div>
    </section>
    <section class="account-shell-form-panel"><div class="account-shell-form-inner"><ng-content select="[account-form]"></ng-content></div></section>
  </main>
</div>

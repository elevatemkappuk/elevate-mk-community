<header class="site-header" [class.activation-header]="layout() === 'activation'">
  <a class="brand-logo" routerLink="/join" aria-label="Elevate MK home">
    <img src="branding/logo.png" alt="Elevate MK" />
  </a>
  @if (showSignIn()) {
    <button class="sign-in-button" type="button" aria-label="Sign in to your Elevate MK account">
      Sign in
    </button>
  }
</header>

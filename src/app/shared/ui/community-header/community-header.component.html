<header class="site-header" [class.activation-header]="layout() === 'activation'">
  <a class="brand-logo" [routerLink]="authenticated() ? '/community' : '/join'" aria-label="Elevate MK home">
    <img src="branding/logo.png" alt="Elevate MK" />
  </a>
  @if (authenticated()) {
    <nav class="authenticated-nav" aria-label="Community navigation">
      <a routerLink="/community" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [attr.aria-current]="(homeLink.isActive ? 'page' : null)" #homeLink="routerLinkActive">Home</a>
      <a routerLink="/community/directory" routerLinkActive="active">Connect</a>
      <a routerLink="/community/profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My Profile</a>
      <button type="button" [disabled]="signingOut()" (click)="signOut.emit()">
        {{ signingOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    </nav>
  } @else if (showSignIn()) {
    <a class="sign-in-button" routerLink="/sign-in" aria-label="Sign in to your Elevate MK account">
      Sign in
    </a>
  }
</header>
